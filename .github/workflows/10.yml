name: WF-Matrix
on: workflow_dispatch
jobs:
   job1:
     runs-on: ${{ matrix.os }}
     strategy:
       fail-fast: false
       max-parallel: 3
       matrix:
         os:
         - ubuntu-latest
         - windows-latest
         appvr:
         - "3.10" 
         - "3.11"
         - "3.12"
         
         exclude:
         - os: windows-latest
           appvr: "3.12"
         
         include:
         - os: ubuntu-latest
           appvr: "3.13"         
     steps:
     - name: Print Msg
       shell: bash     
       run: |
          echo "This is ${{ matrix.os }}-${{ matrix.appvr }}"
          sleep 10
          
          